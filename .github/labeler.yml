# Path-based PR auto-labeling configuration
# Labels are applied based on the files changed in a PR
# Documentation: https://github.com/actions/labeler
#
# Format: actions/labeler@v5 expects each label to hold a list of config
# options; globs go under a matcher (any-glob-to-any-file) inside
# `changed-files`. Bare globs under changed-files fail with "The changed-files
# section must have a valid config structure".

# Frontend changes - UI, components, styling, frontend build config
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**/*'
          - '**/*.css'
          - '**/*.scss'
          - '**/*.tsx'
          - '**/*.jsx'
          - '**/next.config.*'
          - '**/tailwind.config.*'
          - '**/.eslintrc.*'
          - '**/eslint.config.*'

# Contract changes - smart contract code, Soroban, Rust contract logic
contract:
  - changed-files:
      - any-glob-to-any-file:
          - 'contracts/**/*'
          - '**/*.rs'
          - '**/Cargo.toml'
          - '**/Cargo.lock'
          - '**/soroban*'

# DevOps/CI changes - workflows, Docker, deployment scripts, infrastructure
devops:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**/*'
          - '.github/actions/**/*'
          - 'docker-compose*.yml'
          - '**/Dockerfile*'
          - 'scripts/**/*'
          - 'k8s/**/*'
          - 'terraform/**/*'
          - '**/*.sh'

# Documentation changes - markdown files, docs directory
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - '**/*.md'
          - '**/README*'
          - '**/CHANGELOG*'
          - '**/CONTRIBUTING*'
