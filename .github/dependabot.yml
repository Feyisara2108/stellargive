version: 2

# Every ecosystem groups ALL update types (major, minor, patch) into a single
# PR per week. Omitting `update-types` from a group makes it catch everything,
# so a weekly run opens at most one grouped PR per ecosystem instead of a
# separate PR for each major bump. Keeps the PR list small and reviewable.
updates:
  - package-ecosystem: "cargo"
    directory: "/contracts/stellar-give"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/cargo)"
    groups:
      cargo-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/npm)"
    groups:
      frontend-npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/npm)"
    groups:
      root-npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/actions)"
    groups:
      actions-deps:
        patterns:
          - "*"
