version: 2

# Grouping strategy: per ecosystem, minor + patch updates are grouped into a single
# low-risk PR per week, while MAJOR updates are excluded from the group so each
# arrives as its own PR. This keeps the routine weekly bump small and reliably
# mergeable, and isolates breaking major upgrades so one bad major can't block the
# rest. (A dependency matching a group's patterns but NOT its update-types is
# emitted as an individual PR.) Every ecosystem is capped at 5 open PRs so the
# queue stays reviewable; nothing here merges or approves a PR automatically.
updates:
  - package-ecosystem: "cargo"
    directory: "/contracts/stellar-give"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/cargo)"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/npm)"
    groups:
      frontend-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/npm)"
    groups:
      root-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/actions)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/docker)"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
