name: Update Contributors

on:
  push:
    branches:
      - main
    paths:
      - ".all-contributorsrc"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7 # v4.0.2
        with:
          node-version: "20"

      - name: Generate Contributors Table
        run: npx all-contributors-cli generate

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0 # v5.0.1
        with:
          commit_message: "docs: update contributors table [skip ci]"
          file_pattern: README.md
