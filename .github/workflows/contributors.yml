name: Update Contributors

on:
  push:
    branches:
      - main
    paths:
      - '.all-contributorsrc'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@0bef4c7b22a681944a11cc3de49f483a91aa0d65 # v4.0.2
        with:
          node-version: '20'

      - name: Generate Contributors Table
        run: npx all-contributors-cli generate

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@862143bc53f7c1d003bba08d1a1b55bebfb6a0a0 # v5.0.1
        with:
          commit_message: "docs: update contributors table [skip ci]"
          file_pattern: README.md
