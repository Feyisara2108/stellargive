name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build and scan (never push) on PRs so Dockerfile breakage is caught before
  # merge rather than after (#1102).
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"

# Superseded PR runs are cancelled; push runs get a unique group (run_id) so a
# main/tag publish is never queued behind or dropped for another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stellargive-frontend
  # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so
  # they are baked into the image here from repository *variables* (public
  # values only — never secrets). See docs/DEPLOYMENT.md (#1099).
  BUILD_ARGS: |
    NEXT_PUBLIC_SOROBAN_RPC_URL=${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
    NEXT_PUBLIC_NETWORK_PASSPHRASE=${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
    NEXT_PUBLIC_CONTRACT_ID=${{ vars.NEXT_PUBLIC_CONTRACT_ID }}
    NEXT_PUBLIC_USDC_CONTRACT_ID=${{ vars.NEXT_PUBLIC_USDC_CONTRACT_ID }}
    NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}

jobs:
  # PR-only: build with Buildx and scan with Trivy. No registry login, no push,
  # no signing, no write permissions, and no secrets.
  build-pr:
    name: Build & scan Docker image (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (local only, not pushed)
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          push: false
          tags: stellargive-frontend:pr-${{ github.event.pull_request.number }}
          build-args: ${{ env.BUILD_ARGS }}
          # Read the cache main populates (PRs can read the base branch's GHA
          # cache). Writing back is skipped: PR cache entries are scoped to the
          # PR ref, so exporting them would cost time without helping main.
          cache-from: type=gha,scope=stellargive-frontend

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stellargive-frontend:pr-${{ github.event.pull_request.number }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalise image name
        # Registry paths must be lowercase, but repository_owner keeps the
        # account's casing (Feyisara2108), which Docker rejects.
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (local for scanning)
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=stellargive-frontend
          cache-to: type=gha,mode=max,scope=stellargive-frontend
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload scan results to security dashboard
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        # Only when Trivy actually ran; a failed build leaves no report to upload.
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=stellargive-frontend
          cache-to: type=gha,mode=max,scope=stellargive-frontend
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Sign published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Verify signed Docker image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.IMAGE }}@${DIGEST}"
