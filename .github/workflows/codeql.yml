name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # v4 – required for Rust language support
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2.7.3 # v2.7.3
        with:
          workspaces: contracts/stellar-give

      # build-mode: none – CodeQL auto-extracts Rust without a manual build step

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # v4 – required for Rust language support
        with:
          category: "/language:${{ matrix.language }}"
