name: Merged Branch Cleanup

on:
  schedule:
    # Weekly on Sundays at 02:00 UTC — low-traffic window, avoids clashing
    # with the Monday cargo-audit schedule (audit.yml runs Mon 06:00 UTC).
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — list branches that would be deleted without actually deleting them"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write  # needed to delete remote branches via refs/heads/...

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 # v4.2.2
        with:
          # Fetch all refs so we can inspect remote branches
          fetch-depth: 0

      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          # ── Protected-branch patterns ─────────────────────────────────────────
          # These branches are NEVER deleted, regardless of merge status.
          #
          # Rationale for each pattern:
          #   main / master      — primary integration branch; always protected.
          #   dev / develop      — common long-lived development branch name.
          #   staging            — typical pre-production environment branch.
          #   release/*          — release preparation branches (release-please
          #                        and manual release flows use this prefix).
          #   hotfix/*           — emergency hotfix branches kept until cherry-picked.
          #   v[0-9]*            — version tags checked out as branches on occasion.
          #   gh-pages           — GitHub Pages source branch.
          #   renovate/*         — Renovate bot opens long-lived update branches.
          #   dependabot/*       — Dependabot opens long-lived update branches;
          #                        individual merged Dependabot PRs are cleaned up
          #                        but any still-open ones are left alone.
          PROTECTED_PATTERNS=(
            "^main$"
            "^master$"
            "^dev$"
            "^develop$"
            "^staging$"
            "^release/.*"
            "^hotfix/.*"
            "^v[0-9].*"
            "^gh-pages$"
            "^renovate/.*"
          )

          is_protected() {
            local branch="$1"
            for pattern in "${PROTECTED_PATTERNS[@]}"; do
              if [[ "$branch" =~ $pattern ]]; then
                return 0
              fi
            done
            return 1
          }

          echo "## Merged Branch Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dry run:** ${DRY_RUN}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # List branches already merged into main via the GitHub API (avoids
          # needing a full clone of every branch). gh api paginates automatically.
          MERGED_BRANCHES=$(gh api \
            --paginate \
            "repos/${REPO}/branches?per_page=100" \
            --jq '.[].name')

          DELETED_BRANCHES=()
          SKIPPED_PROTECTED=()
          SKIPPED_UNMERGED=()

          while IFS= read -r branch; do
            # Skip empty lines
            [ -z "$branch" ] && continue

            # Skip protected branches
            if is_protected "$branch"; then
              SKIPPED_PROTECTED+=("$branch")
              continue
            fi

            # Check whether the branch is fully merged into main
            # gh api returns 204 (no body) if branch IS merged, 404 if not.
            HTTP_STATUS=$(gh api \
              --include \
              "repos/${REPO}/compare/main...${branch}" \
              --jq '.status' 2>/dev/null || echo "error")

            # A branch is "merged" when its HEAD is reachable from main, i.e.
            # the compare API returns "behind" or "identical" (0 ahead commits).
            AHEAD=$(gh api \
              "repos/${REPO}/compare/main...${branch}" \
              --jq '.ahead_by' 2>/dev/null || echo "-1")

            if [ "$AHEAD" = "0" ] || [ "$AHEAD" = "-1" ]; then
              # ahead_by == 0  → branch has no commits not in main  (merged)
              # ahead_by == -1 → API error; skip conservatively
              if [ "$AHEAD" = "-1" ]; then
                SKIPPED_UNMERGED+=("$branch (API error – skipped conservatively)")
                continue
              fi

              if [ "${DRY_RUN}" = "true" ]; then
                echo "  [dry-run] Would delete: ${branch}"
                DELETED_BRANCHES+=("${branch} _(dry run)_")
              else
                echo "  Deleting merged branch: ${branch}"
                gh api \
                  --method DELETE \
                  "repos/${REPO}/git/refs/heads/${branch}" \
                  && DELETED_BRANCHES+=("${branch}") \
                  || echo "  ⚠️  Failed to delete ${branch} (may already be gone)"
              fi
            else
              SKIPPED_UNMERGED+=("$branch (${AHEAD} commit(s) ahead of main)")
            fi
          done <<< "$MERGED_BRANCHES"

          # ── Write job summary ───────────────────────────────────────────────
          {
            echo "### Deleted branches (${#DELETED_BRANCHES[@]})"
            echo ""
            if [ "${#DELETED_BRANCHES[@]}" -eq 0 ]; then
              echo "_No merged branches to delete._"
            else
              for b in "${DELETED_BRANCHES[@]}"; do
                echo "- \`${b}\`"
              done
            fi
            echo ""
            echo "### Skipped — protected patterns (${#SKIPPED_PROTECTED[@]})"
            echo ""
            if [ "${#SKIPPED_PROTECTED[@]}" -eq 0 ]; then
              echo "_None._"
            else
              for b in "${SKIPPED_PROTECTED[@]}"; do
                echo "- \`${b}\`"
              done
            fi
            echo ""
            echo "### Skipped — not yet merged / error (${#SKIPPED_UNMERGED[@]})"
            echo ""
            if [ "${#SKIPPED_UNMERGED[@]}" -eq 0 ]; then
              echo "_None._"
            else
              for b in "${SKIPPED_UNMERGED[@]}"; do
                echo "- \`${b}\`"
              done
            fi
            echo ""
            echo "---"
            echo "_Protected patterns: \`main\`, \`master\`, \`dev\`, \`develop\`, \`staging\`, \`release/*\`, \`hotfix/*\`, \`v[0-9]*\`, \`gh-pages\`, \`renovate/*\`_"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Done. Deleted: ${#DELETED_BRANCHES[@]} branch(es)."
