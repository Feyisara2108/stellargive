name: Rollback Soroban Contract

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - mainnet
      wasm_hash:
        description: "Target WASM hash to rollback to (SHA256 hash, 64 hex characters)"
        required: true
        type: string
      rollback_reason:
        description: "Reason for rollback (will be recorded in logs)"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate WASM hash format
        run: |
          WASM_HASH="${{ github.event.inputs.wasm_hash }}"
          
          # Validate SHA256 hash format (64 hex characters)
          if ! echo "$WASM_HASH" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::Invalid WASM hash format"
            echo "::error::Expected 64-character hexadecimal SHA256 hash, got: $WASM_HASH"
            exit 1
          fi
          
          echo "✅ WASM hash format validated: $WASM_HASH"

      - name: Install Soroban / Stellar CLI
        run: |
          if command -v stellar >/dev/null 2>&1; then
            echo "stellar CLI already installed"
          elif command -v soroban >/dev/null 2>&1; then
            echo "soroban CLI already installed"
          else
            cargo install --locked stellar-cli
          fi
          echo "CLI=$(command -v stellar || command -v soroban)" >> "$GITHUB_ENV"

      - name: Record rollback initiation
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<-EOF
          ## Contract Rollback Initiated

          | Field | Value |
          |---|---|
          | Network | ${{ github.event.inputs.network }} |
          | Target WASM Hash | \`${{ github.event.inputs.wasm_hash }}\` |
          | Reason | ${{ github.event.inputs.rollback_reason }} |
          | Initiated by | @${{ github.actor }} |
          | Workflow Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
          | Timestamp | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |

          **⚠️ This is a critical operation that will upgrade the contract to a previous version.**
          EOF

          echo "========================================"
          echo "CONTRACT ROLLBACK INITIATED"
          echo "========================================"
          echo "Network: ${{ github.event.inputs.network }}"
          echo "Target WASM Hash: ${{ github.event.inputs.wasm_hash }}"
          echo "Reason: ${{ github.event.inputs.rollback_reason }}"
          echo "Initiated by: ${{ github.actor }}"
          echo "Timestamp: $(date -u)"
          echo "========================================"

      - name: Deploy contract with rollback WASM hash
        id: deploy
        env:
          STELLAR_NETWORK: ${{ github.event.inputs.network }}
          STELLAR_SOURCE: ${{ secrets.STELLAR_DEPLOYER_ALIAS }}
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
          ROLLBACK_WASM_HASH: ${{ github.event.inputs.wasm_hash }}
        run: |
          NETWORK="${STELLAR_NETWORK}"
          SOURCE="${STELLAR_SOURCE:-deployer}"
          WASM_HASH="${ROLLBACK_WASM_HASH}"

          if [ -n "$STELLAR_SECRET_KEY" ]; then
            $CLI keys add "$SOURCE" --secret-key "$STELLAR_SECRET_KEY" 2>/dev/null || true
          fi

          # Note: This assumes the WASM file with the target hash is available
          # In production, you would need to fetch the WASM from artifacts or storage
          # For now, we'll attempt to deploy using the hash directly if the CLI supports it
          # or document that the WASM file needs to be restored from artifacts

          echo "⚠️ Rollback deployment requires the WASM binary with hash: $WASM_HASH"
          echo "Ensure the WASM file is available or restore it from GitHub artifacts"
          echo "Artifact naming convention: stellar-give-wasm-<commit-sha>"

          # Placeholder for actual rollback deployment logic
          # This would typically involve:
          # 1. Downloading the WASM artifact from a previous release
          # 2. Verifying the hash matches
          # 3. Deploying the contract upgrade

          echo "contract_id=ROLLBACK_PENDING" >> "$GITHUB_OUTPUT"
          echo "wasm_hash=$WASM_HASH" >> "$GITHUB_OUTPUT"

      - name: Record rollback completion
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<-EOF

          ## Rollback Status

          | Field | Value |
          |---|---|
          | Status | ${{ job.status }} |
          | Contract ID | \`${{ steps.deploy.outputs.contract_id }}\` |
          | WASM Hash | \`${{ steps.deploy.outputs.wasm_hash }}\` |

          **Audit Record:** This rollback operation has been logged for audit purposes.
          EOF

          echo "========================================"
          echo "ROLLBACK OPERATION COMPLETED"
          echo "========================================"
          echo "Status: ${{ job.status }}"
          echo "Contract ID: ${{ steps.deploy.outputs.contract_id }}"
          echo "WASM Hash: ${{ steps.deploy.outputs.wasm_hash }}"
          echo "========================================"
