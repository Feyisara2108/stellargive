name: "Workflow Step 8"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  optimize-step-8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cache Policy for Step 8
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-step8
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Actionlint Validation
        uses: reviewdog/action-actionlint@v1
        with:
          level: warning
          reporter: github-pr-check
