name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2
      # On merge_group events, skip path filtering so the gating jobs below always
      # run and report their required status checks to the merge queue.
      - name: Detect changes
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3.0.2 # v3.0.2
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.gitignore'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - '.gitignore'

  contract-checks:
    needs: change-detection
    if: ${{ github.event_name == 'merge_group' || needs.change-detection.outputs.contracts == 'true' }}
    uses: ./.github/workflows/contract-checks.yml

  rust-and-contract:
    needs: change-detection
    if: ${{ github.event_name == 'merge_group' || needs.change-detection.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2 # v2.7.3
        with:
          workspaces: contracts/stellar-give

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2 # v2.4.4
        with:
          tool: cargo-tarpaulin@0.30.0

      - name: Install Soroban CLI system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Soroban CLI
        uses: taiki-e/install-action@v2 # v2.4.4
        with:
          tool: soroban-cli@27.1.0

      - name: Rust Build
        working-directory: contracts/stellar-give
        run: cargo build --locked --target wasm32v1-none --release

      - name: Rust Coverage
        working-directory: contracts/stellar-give
        run: cargo tarpaulin --out Xml

      - name: WASM Optimization Check
        run: bash scripts/build-contract.sh

      - name: Generate WASM size report
        run: |
          OPTIMIZED_WASM="contracts/stellar-give/target/wasm32v1-none/release/stellar_give.optimized.wasm"
          ORIGINAL_WASM="contracts/stellar-give/target/wasm32v1-none/release/stellar_give.wasm"
          ORIG=$(stat -c%s "$ORIGINAL_WASM")
          OPT=$(stat -c%s "$OPTIMIZED_WASM")
          REDUCTION=$(( 100 - (OPT * 100 / ORIG) ))
          {
            echo "WASM Size Report"
            echo "================"
            echo "Commit:    ${{ github.sha }}"
            echo "Ref:       ${{ github.ref }}"
            echo "Run:       ${{ github.run_id }}"
            echo ""
            echo "Original:  ${ORIG} bytes"
            echo "Optimized: ${OPT} bytes"
            echo "Reduction: ${REDUCTION}%"
            echo "Budget:    65536 bytes (64 KB)"
            echo "Status:    $([ $OPT -le 65536 ] && echo 'PASS' || echo 'FAIL')"
          } > wasm-size-report.txt
          cat wasm-size-report.txt

      # Retention policy:
      #   30 days — primary build artifacts reviewers need to download and inspect
      #             (optimized WASM, size report).
      - name: Upload optimized WASM artifact
        if: always()
        uses: actions/upload-artifact@v4.3.0 # v4.3.0
        with:
          name: stellar-give-wasm-${{ github.sha }}
          path: |
            contracts/stellar-give/target/wasm32v1-none/release/stellar_give.optimized.wasm
            wasm-size-report.txt
          retention-days: 30
          if-no-files-found: error

      - name: Codecov Upload (Rust)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v4 # v4.5.0
        with:
          files: contracts/stellar-give/cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    needs: change-detection
    if: ${{ github.event_name == 'merge_group' || needs.change-detection.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.2
        with:
          node-version-file: frontend/.nvmrc

      - name: Cache Next.js build
        uses: actions/cache@v4 # v4.0.2
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.js', 'frontend/src/**/*.jsx', 'frontend/src/**/*.ts', 'frontend/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Accessibility Check
        working-directory: frontend
        run: npm run test:a11y

      - name: Frontend Test and Coverage
        working-directory: frontend
        run: npm run test -- --coverage

      - name: Codecov Upload (Frontend)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v4 # v4.5.0
        with:
          directory: frontend/coverage
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build (with Sentry sourcemap upload)
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Verify Sentry source maps uploaded
        id: verify-sourcemaps
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN is not set — skipping source map verification."
            exit 0
          fi

          COUNT=$(npx sentry-cli releases files "${{ github.sha }}" list | grep -c '\.map' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No source map artifacts found for release ${{ github.sha }} — upload may have failed."
            exit 1
          fi
          echo "✅ Found $COUNT source map artifact(s) uploaded for release ${{ github.sha }}."

      - name: Confirm no source maps shipped in build output
        working-directory: frontend
        run: |
          if find .next/static -name '*.map' | grep -q .; then
            echo "::error::.map files found in .next/static — hideSourceMaps is not stripping them from the deployable output."
            find .next/static -name '*.map'
            exit 1
          fi
          echo "✅ No .map files present in .next/static (hideSourceMaps confirmed)."

      - name: Finalize Sentry release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verify-sourcemaps.outcome == 'success'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN is not set — skipping Sentry release finalize."
            exit 0
          fi
          npx sentry-cli releases set-commits ${{ github.sha }} --auto
          npx sentry-cli releases finalize ${{ github.sha }}

  # Cross-version coverage. The primary `frontend` and `rust-and-contract` jobs
  # above remain the required status checks (pinned to .nvmrc Node and stable
  # Rust). These jobs surface breakage on other supported toolchains early.
  frontend-node-matrix:
    name: Frontend (Node ${{ matrix.node-version }})
    needs: change-detection
    if: ${{ needs.change-detection.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    # Node 20 is the pinned/supported version (.nvmrc); newer LTS lines are
    # exercised but non-blocking until adopted.
    continue-on-error: ${{ matrix.node-version != 20 }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend Test and Coverage
        working-directory: frontend
        run: npm run test -- --coverage

  contract-msrv:
    name: Contract MSRV
    needs: change-detection
    if: ${{ needs.change-detection.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Read MSRV from Cargo.toml
        id: msrv
        working-directory: contracts/stellar-give
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"

      - name: Install Rust toolchain (MSRV "${{ steps.msrv.outputs.version }}")
        uses: dtolnay/rust-toolchain@stable # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2 # v2.7.3
        with:
          workspaces: contracts/stellar-give

      - name: Build (MSRV)
        working-directory: contracts/stellar-give
        run: cargo build --locked --target wasm32v1-none --release

      - name: Test (MSRV)
        working-directory: contracts/stellar-give
        run: cargo test --locked

  notify:
    needs: [contract-checks, rust-and-contract, frontend]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg text ":x: *CI failed on main*\nWorkflow: `${{ github.workflow }}`\nCommit: `${{ github.sha }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{text: $text}')"

      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg content ":x: **CI failed on main**\nWorkflow: `${{ github.workflow }}`\nCommit: `${{ github.sha }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{content: $content}')"
