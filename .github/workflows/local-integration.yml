name: Local Stellar Integration

# Runs create / donate / events / refund against a real Quickstart node.
# Triggered on a nightly schedule and whenever contract or RPC-layer code changes.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "frontend/src/lib/soroban.ts"
      - "frontend/src/lib/eventData.ts"
      - "frontend/src/__tests__/integration/**"
      - "scripts/deploy-local.sh"
      - "scripts/build-contract.sh"
      - "docker-compose.yml"
      - ".github/workflows/local-integration.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "frontend/src/lib/soroban.ts"
      - "frontend/src/lib/eventData.ts"
      - "frontend/src/__tests__/integration/**"
      - "scripts/deploy-local.sh"
      - "scripts/build-contract.sh"
      - "docker-compose.yml"
      - ".github/workflows/local-integration.yml"

concurrency:
  group: local-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/stellar-give

      - name: Install Soroban CLI system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Soroban CLI
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: soroban-cli@27.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start Stellar Quickstart
        run: docker compose up -d stellar

      - name: Deploy contract to local network
        id: deploy
        run: |
          chmod +x scripts/deploy-local.sh scripts/build-contract.sh
          OUTPUT=$(./scripts/deploy-local.sh)
          echo "$OUTPUT"
          CONTRACT_ID=$(echo "$OUTPUT" | grep -E '^CONTRACT_ID=' | tail -n1 | cut -d= -f2)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          test -n "$CONTRACT_ID"

      - name: Run local-network integration suite
        working-directory: frontend
        env:
          RUN_LOCAL_STELLAR: "1"
          NEXT_PUBLIC_CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: http://localhost:8000/rpc
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          FRIENDBOT_URL: http://localhost:8000/friendbot
        run: npm run test:integration

      - name: Dump Quickstart logs on failure
        if: failure()
        run: docker compose logs stellar --tail=200
