name: Deploy Soroban Contract

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - mainnet
      network_confirmation:
        description: "Type the network name to confirm deployment (required for mainnet)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate network confirmation
        run: |
          NETWORK="${{ github.event.inputs.network || 'testnet' }}"
          CONFIRMATION="${{ github.event.inputs.network_confirmation }}"

          if [ "$NETWORK" = "mainnet" ]; then
            if [ -z "$CONFIRMATION" ]; then
              echo "::error::Network confirmation is required for mainnet deployment"
              echo "::error::Please provide the network confirmation by typing 'mainnet' in the workflow input"
              exit 1
            fi
            if [ "$CONFIRMATION" != "mainnet" ]; then
              echo "::error::Network confirmation does not match target network"
              echo "::error::Expected: mainnet, Got: $CONFIRMATION"
              exit 1
            fi
            echo "✅ Mainnet deployment confirmed"
          else
            echo "ℹ️ Testnet deployment - confirmation not required"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32v1-none

      - name: Install Soroban / Stellar CLI
        run: |
          if command -v stellar >/dev/null 2>&1; then
            echo "stellar CLI already installed"
          elif command -v soroban >/dev/null 2>&1; then
            echo "soroban CLI already installed"
          else
            cargo install --locked stellar-cli
          fi
          echo "CLI=$(command -v stellar || command -v soroban)" >> "$GITHUB_ENV"

      - name: Build contract WASM
        run: |
          cd contracts/stellar-give
          cargo build --target wasm32v1-none --release

      - name: Check WASM size
        run: |
          WASM="contracts/stellar-give/target/wasm32v1-none/release/stellar_give.wasm"
          SIZE=$(stat --format=%s "$WASM")
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 65536 ]; then
            echo "error: WASM exceeds 64KB limit ($SIZE bytes)"
            exit 1
          fi

      - name: Deploy contract
        id: deploy
        env:
          STELLAR_NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          STELLAR_SOURCE: ${{ secrets.STELLAR_DEPLOYER_ALIAS }}
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          WASM="contracts/stellar-give/target/wasm32v1-none/release/stellar_give.wasm"
          WASM_HASH=$(sha256sum "$WASM" | awk '{print $1}')

          NETWORK="${STELLAR_NETWORK}"
          SOURCE="${STELLAR_SOURCE:-deployer}"

          if [ -n "$STELLAR_SECRET_KEY" ]; then
            $CLI keys add "$SOURCE" --secret-key "$STELLAR_SECRET_KEY" 2>/dev/null || true
          fi

          DEPLOY_OUTPUT=$($CLI contract deploy \
            --wasm "$WASM" \
            --network "$NETWORK" \
            --source "$SOURCE" 2>&1)

          CONTRACT_ID=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'C[A-Z0-9]{55}' | head -n 1)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "wasm_hash=$WASM_HASH" >> "$GITHUB_OUTPUT"
          echo "Contract deployed: $CONTRACT_ID"

      - name: Create release summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<-EOF
          ## Contract Deployment

          | Field | Value |
          |---|---|
          | Network | ${{ github.event.inputs.network || 'testnet' }} |
          | Contract ID | \`${{ steps.deploy.outputs.contract_id }}\` |
          | WASM Hash | \`${{ steps.deploy.outputs.wasm_hash }}\` |
          | Tag | ${{ github.ref_name }} |

          Deployed via commit ${{ github.sha }}.
          EOF

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stellar-give-wasm-${{ github.sha }}
          path: contracts/stellar-give/target/wasm32v1-none/release/stellar_give.wasm
          retention-days: 90
