name: Deploy Soroban Contract

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Soroban / Stellar CLI
        run: |
          if command -v stellar >/dev/null 2>&1; then
            echo "stellar CLI already installed"
          elif command -v soroban >/dev/null 2>&1; then
            echo "soroban CLI already installed"
          else
            cargo install --locked stellar-cli
          fi
          echo "CLI=$(command -v stellar || command -v soroban)" >> "$GITHUB_ENV"

      - name: Build contract WASM
        run: |
          cd contracts/stellar-give
          cargo build --target wasm32-unknown-unknown --release

      - name: Check WASM size
        run: |
          WASM="contracts/stellar-give/target/wasm32-unknown-unknown/release/stellar_give.wasm"
          SIZE=$(stat --format=%s "$WASM")
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 65536 ]; then
            echo "error: WASM exceeds 64KB limit ($SIZE bytes)"
            exit 1
          fi

      - name: Deploy contract
        id: deploy
        env:
          STELLAR_NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          STELLAR_SOURCE: ${{ secrets.STELLAR_DEPLOYER_ALIAS }}
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          WASM="contracts/stellar-give/target/wasm32-unknown-unknown/release/stellar_give.wasm"
          WASM_HASH=$(sha256sum "$WASM" | awk '{print $1}')

          NETWORK="${STELLAR_NETWORK}"
          SOURCE="${STELLAR_SOURCE:-deployer}"

          if [ -n "$STELLAR_SECRET_KEY" ]; then
            $CLI keys add "$SOURCE" --secret-key "$STELLAR_SECRET_KEY" 2>/dev/null || true
          fi

          DEPLOY_OUTPUT=$($CLI contract deploy \
            --wasm "$WASM" \
            --network "$NETWORK" \
            --source "$SOURCE" 2>&1)

          CONTRACT_ID=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'C[A-Z0-9]{55}' | head -n 1)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "wasm_hash=$WASM_HASH" >> "$GITHUB_OUTPUT"
          echo "Contract deployed: $CONTRACT_ID"

      - name: Create release summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<-EOF
          ## Contract Deployment

          | Field | Value |
          |---|---|
          | Network | ${{ github.event.inputs.network || 'testnet' }} |
          | Contract ID | \`${{ steps.deploy.outputs.contract_id }}\` |
          | WASM Hash | \`${{ steps.deploy.outputs.wasm_hash }}\` |
          | Tag | ${{ github.ref_name }} |

          Deployed via commit ${{ github.sha }}.
          EOF

      - name: Upload WASM artifact
        uses: actions/upload-artifact@6011914590750262c2f6d764491748530b59d991 # v4.3.0
        with:
          name: stellar-give-wasm-${{ github.sha }}
          path: contracts/stellar-give/target/wasm32-unknown-unknown/release/stellar_give.wasm
          retention-days: 90
