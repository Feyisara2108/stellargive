name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5 # v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # Branch protection prevents GitHub Actions from creating PRs directly.
          # skip-github-pull-request still creates a release and tag when a PR
          # lands via the manifest, but won't fail if PR creation is restricted.
          skip-github-pull-request: true

      - name: Log Release Creation
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Release was successfully created!"
          echo "Tag: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"

  sbom:
    name: Generate SBOM
    needs: [release-please, enrich-release-notes]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 # v4.2.2

      # ── Frontend SBOM (npm / CycloneDX) ──────────────────────────────────
      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Generate frontend SBOM
        working-directory: frontend
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file ../sbom-frontend.cdx.json
          echo "Frontend SBOM generated."

      # ── Contract SBOM + optimized WASM (cargo / CycloneDX) ───────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          targets: wasm32v1-none

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2 # v2.4.4
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate contract SBOM
        working-directory: contracts/stellar-give
        run: |
          cargo cyclonedx --format json --output-cdx
          mv bom.json ../../sbom-contracts.cdx.json
          echo "Contract SBOM generated."

      - name: Install Soroban CLI system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Soroban CLI
        uses: taiki-e/install-action@v2 # v2.4.4
        with:
          tool: soroban-cli@27.1.0

      - name: Build optimized contract WASM
        run: bash scripts/build-contract.sh

      - name: Copy optimized WASM for release
        run: |
          cp contracts/stellar-give/target/wasm32v1-none/release/stellar_give.optimized.wasm ./stellar_give.optimized.wasm
          cp stellar_give.optimized.wasm ./stellar_give.wasm

      # Defense-in-depth: build-contract.sh already enforces 50KB; re-check the
      # copied release artifact so a bad path/copy cannot ship an oversized binary.
      - name: Assert release WASM size budget (50KB)
        run: |
          MAX_WASM_BYTES=51200
          SIZE=$(stat -c%s stellar_give.wasm)
          echo "Release artifact stellar_give.wasm: ${SIZE} bytes (budget ${MAX_WASM_BYTES})"
          if [ "$SIZE" -gt "$MAX_WASM_BYTES" ]; then
            echo "::error::stellar_give.wasm (${SIZE} bytes) exceeds the 50KB budget (${MAX_WASM_BYTES} bytes)."
            exit 1
          fi

      - name: Upload optimized WASM artifact
        uses: actions/upload-artifact@v7.0.1 # v4.3.0
        with:
          name: stellar_give.wasm
          path: |
            stellar_give.wasm
            stellar_give.optimized.wasm
          retention-days: 90
          if-no-files-found: error

      # ── Sign SBOMs (Sigstore/cosign, keyless) ─────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2 # v3.5.0

      - name: Sign SBOMs
        run: |
          cosign sign-blob --yes \
            --output-signature sbom-frontend.cdx.json.sig \
            --output-certificate sbom-frontend.cdx.json.pem \
            sbom-frontend.cdx.json
          cosign sign-blob --yes \
            --output-signature sbom-contracts.cdx.json.sig \
            --output-certificate sbom-contracts.cdx.json.pem \
            sbom-contracts.cdx.json

      # ── Build provenance attestation for released artifacts ───────────────
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2 # v2.2.0
        with:
          subject-path: |
            sbom-frontend.cdx.json
            sbom-contracts.cdx.json
            stellar_give.wasm
            stellar_give.optimized.wasm

      # ── Attach everything to the GitHub Release ───────────────────────────
      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            sbom-frontend.cdx.json \
            sbom-frontend.cdx.json.sig \
            sbom-frontend.cdx.json.pem \
            sbom-contracts.cdx.json \
            sbom-contracts.cdx.json.sig \
            sbom-contracts.cdx.json.pem \
            stellar_give.wasm \
            stellar_give.optimized.wasm \
            --clobber

  enrich-release-notes:
    name: Enrich release notes with labels and contributors
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - name: Generate and patch enriched release notes
        uses: actions/github-script@v9.0.0 # v7.0.1
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = process.env.TAG_NAME;
            const { owner, repo } = context.repo;

            // ── 1. Find the previous tag to determine the comparison range ──
            const { data: tags } = await github.rest.repos.listTags({
              owner, repo, per_page: 10,
            });
            const tagNames = tags.map(t => t.name);
            const currentIdx = tagNames.indexOf(tagName);
            const previousTag = currentIdx >= 0 && currentIdx + 1 < tagNames.length
              ? tagNames[currentIdx + 1]
              : null;

            core.info(`Current tag: ${tagName}  Previous tag: ${previousTag ?? '(none — first release)'}`);

            // ── 2. Collect merged PRs in the range ──────────────────────────
            // Strategy: list commits between the two tags, then resolve each
            // commit SHA to a merged PR via the "list PRs associated with a commit" API.
            let prNumbers = new Set();
            if (previousTag) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo,
                basehead: `${previousTag}...${tagName}`,
                per_page: 250,
              });
              for (const commit of (comparison.commits || [])) {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: commit.sha, per_page: 10,
                });
                for (const pr of prs) {
                  if (pr.merged_at) prNumbers.add(pr.number);
                }
              }
            } else {
              // First release: take the 100 most-recently closed PRs as a best effort.
              const { data: recent } = await github.rest.pulls.list({
                owner, repo, state: 'closed', sort: 'updated',
                direction: 'desc', per_page: 100,
              });
              for (const pr of recent) {
                if (pr.merged_at) prNumbers.add(pr.number);
              }
            }

            core.info(`Found ${prNumbers.size} merged PR(s) in this release.`);

            // ── 3. Fetch full PR objects (labels, author, title, URL) ────────
            const prs = [];
            for (const num of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: num });
              prs.push(pr);
            }

            // ── 4. Group PRs by label ────────────────────────────────────────
            // Label → display section title mapping, in display order.
            // Labels are sourced from the repo's create-labels.sh and ISSUES.md.
            const CATEGORY_ORDER = [
              { label: 'enhancement', title: '🚀 Features' },
              { label: 'frontend',    title: '🖥️  Frontend' },
              { label: 'contract',    title: '🔗 Smart Contracts' },
              { label: 'bug',         title: '🐛 Bug Fixes' },
              { label: 'security',    title: '🔒 Security' },
              { label: 'docs',        title: '📚 Documentation' },
              { label: 'ci',          title: '⚙️  CI / DevOps' },
              { label: 'devops',      title: '⚙️  CI / DevOps' },
              { label: 'infra',       title: '🏗️  Infrastructure' },
              { label: 'performance', title: '⚡ Performance' },
              { label: 'testing',     title: '🧪 Testing' },
              { label: 'a11y',        title: '♿ Accessibility' },
              { label: 'dependencies','title': '📦 Dependencies' },
              { label: 'chore',       title: '🔧 Chores' },
            ];

            const categorized = new Map(); // label → []
            const uncategorized = [];
            const contributorLogins = new Set();

            for (const pr of prs) {
              const labels = (pr.labels || []).map(l => l.name);
              // Skip release-please's own release PRs
              if (labels.includes('autorelease: pending') || labels.includes('autorelease: tagged')) continue;

              if (pr.user?.login) contributorLogins.add(pr.user.login);

              let placed = false;
              for (const cat of CATEGORY_ORDER) {
                if (labels.includes(cat.label)) {
                  if (!categorized.has(cat.title)) categorized.set(cat.title, []);
                  categorized.get(cat.title).push(pr);
                  placed = true;
                  break;
                }
              }
              if (!placed) uncategorized.push(pr);
            }

            // ── 5. Render the enriched notes ─────────────────────────────────
            const prLine = pr =>
              `- ${pr.title} ([#${pr.number}](${pr.html_url})) — @${pr.user?.login ?? 'unknown'}`;

            const sections = [];

            for (const [title, items] of categorized) {
              if (!items.length) continue;
              sections.push(`### ${title}\n\n${items.map(prLine).join('\n')}`);
            }

            if (uncategorized.length) {
              sections.push(`### 🔀 Other Changes\n\n${uncategorized.map(prLine).join('\n')}`);
            }

            // Contributors section (sorted, deduplicated)
            const contributors = [...contributorLogins].sort();
            let contributorsSection = '';
            if (contributors.length) {
              contributorsSection = [
                '### 🙏 Contributors',
                '',
                'Thank you to everyone who contributed to this release:',
                '',
                contributors.map(l => `- @${l}`).join('\n'),
              ].join('\n');
            }

            const newBody = [
              sections.join('\n\n'),
              contributorsSection,
            ].filter(Boolean).join('\n\n');

            if (!newBody.trim()) {
              core.info('No enriched content to add — skipping release body update.');
              return;
            }

            // ── 6. Fetch the existing release and prepend enriched notes ─────
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
            const existingBody = (release.body || '').trim();

            const separator = existingBody ? '\n\n---\n\n' : '';
            const updatedBody = `${newBody}${separator}${existingBody}`;

            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: release.id,
              body: updatedBody,
            });

            core.info(`Release ${tagName} notes updated with ${contributors.length} contributor(s) and ${categorized.size} category section(s).`);

  notify:
    needs: [release-please, sbom, enrich-release-notes]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg text ":x: *Release failed on main*\nWorkflow: `${{ github.workflow }}`\nCommit: `${{ github.sha }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{text: $text}')"

      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg content ":x: **Release failed on main**\nWorkflow: `${{ github.workflow }}`\nCommit: `${{ github.sha }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{content: $content}')"
