name: Stale Issues & PRs

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@1184758553f162e74a1d37c8104523d11d3c00ab # v9.0.0
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had activity in the last 30 days. It will be closed in 14 days if no
            further activity occurs. If this issue is still relevant, please leave
            a comment or remove the `stale` label.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had activity in the last 30 days. It will be closed in 14
            days if no further activity occurs. If you are still working on this,
            please leave a comment or remove the `stale` label.
          close-issue-message: >
            This issue was closed because it has been inactive for 44 days.
            Feel free to reopen if it is still relevant.
          close-pr-message: >
            This pull request was closed because it has been inactive for 44
            days. Feel free to reopen if you plan to continue working on it.
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,rpc-outage
          exempt-pr-labels: pinned,security
          exempt-all-milestones: true
          exempt-assignees: true
          operations-per-run: 100
          remove-stale-when-updated: true
