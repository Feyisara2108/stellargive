name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.2
        with:
          node-version-file: frontend/.nvmrc

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment
        working-directory: frontend
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Frontend
        working-directory: frontend
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        id: deploy
        working-directory: frontend
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" --meta githubPrNumber=${{ github.event.pull_request.number }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Comment Preview URL
        uses: actions/github-script@v7.0.1 # v7.0.1
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Preview Deployment')
            );
            const body = `## Preview Deployment\n\n🚀 Preview URL: ${{ steps.deploy.outputs.url }}\n\nThis preview will automatically deploy on new pushes to this PR.`;
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.2
        with:
          node-version-file: frontend/.nvmrc

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Teardown Preview
        working-directory: frontend
        run: |
          deployment_ids=$(vercel list --meta githubPrNumber=${{ github.event.pull_request.number }} --format json --token=${{ secrets.VERCEL_TOKEN }} | jq -r '.deployments[].uid')
          if [ -z "$deployment_ids" ]; then
            echo "No deployment found for PR #${{ github.event.pull_request.number }}; nothing to remove."
            exit 0
          fi
          echo "$deployment_ids" | xargs -r -I {} vercel rm {} --yes --token=${{ secrets.VERCEL_TOKEN }}
