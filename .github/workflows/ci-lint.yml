name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier check
        working-directory: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(git -C .. diff --name-only "$BASE_SHA" "$HEAD_SHA" -- frontend | sed 's|^frontend/||')
          if ((${#files[@]} == 0)); then
            echo "No changed frontend files to format-check."
            exit 0
          fi
          npx prettier --check "${files[@]}"
