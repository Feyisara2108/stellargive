name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly scan on Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable

      - name: Cache cargo registry
        uses: actions/cache@v4 # v4.0.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2 # v2.4.4
        with:
          tool: cargo-audit@0.22.2

      - name: Run cargo audit
        working-directory: contracts/stellar-give
        # Deny actual security issues but allow "yanked" warnings – yanked transitive
        # deps (e.g. spin 0.9.8 pulled in by soroban-sdk) are supply-chain hygiene,
        # not vulnerabilities; they cannot be updated without an SDK bump.
        run: cargo audit --deny unsound --deny unmaintained --deny vulnerabilities

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.2
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        # Scope to production deps (dev/build tooling like vite, eslint, storybook
        # never ships to users) and fail on critical. The remaining high advisories
        # (axios via @stellar/stellar-sdk, next) only have fixes behind breaking
        # major upgrades (@stellar/stellar-sdk v15, next 16) tracked as a separate
        # dependency-modernization task; the critical Next.js advisory is already patched.
        run: npm audit --omit=dev --audit-level=critical
