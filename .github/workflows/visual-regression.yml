name: Visual Regression

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.2
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual regression tests
        working-directory: frontend
        run: npx playwright test --project=desktop --project=firefox --project=webkit --project=mobile --project=mobile-safari
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4.3.0 # v4.3.0
        with:
          name: playwright-report
          path: playwright-report/
          # Retention policy:
          #   30 days — primary test report; kept long enough for cross-PR
          #             baseline comparison and post-merge review.
          retention-days: 30

      - name: Upload failed screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4.3.0 # v4.3.0
        with:
          name: failed-screenshot-diffs
          path: test-results/
          # Retention policy:
          #   7 days — short-lived debugging artifact; diffs are only useful
          #             while the failing PR is open and being fixed.
          retention-days: 7
