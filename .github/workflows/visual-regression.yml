name: Visual Regression

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.2
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual regression tests
        working-directory: frontend
        run: npx playwright test --project=desktop --project=firefox --project=webkit --project=mobile --project=mobile-safari
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4.3.0 # v4.3.0
        with:
          name: playwright-report
          path: frontend/playwright-report/
          # Retention policy:
          #   30 days — primary HTML report (includes visual diffs in the UI).
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload failed screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4.3.0 # v4.3.0
        with:
          name: failed-screenshot-diffs
          path: frontend/test-results/
          # Retention policy:
          #   14 days — expected/actual/diff PNGs for failing visual assertions.
          retention-days: 14
          if-no-files-found: ignore

      - name: Visual regression summary
        if: always()
        working-directory: frontend
        run: |
          {
            echo "## Visual regression"
            echo ""
            echo "HTML report artifact: \`playwright-report\` (30 days)."
            echo "On failure, download \`failed-screenshot-diffs\` (\`test-results/\`, **14-day** retention) for expected / actual / diff PNGs."
            echo ""
            if [ -d test-results ]; then
              echo "### Captured files"
              echo ""
              find test-results -type f \( -name '*diff*' -o -name '*actual*' -o -name '*expected*' -o -name '*.png' \) \
                | sort | sed 's/^/- `/' | sed 's/$/`/' || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
