name: Visual Regression

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual regression tests
        working-directory: frontend
        run: npx playwright test --project=desktop --project=firefox --project=webkit --project=mobile --project=mobile-safari
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          # Retention policy:
          #   30 days — primary HTML report (includes visual diffs in the UI).
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload failed screenshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-screenshot-diffs
          path: frontend/test-results/
          # Retention policy:
          #   14 days — expected/actual/diff PNGs for failing visual assertions.
          retention-days: 14
          if-no-files-found: ignore

      - name: Visual regression summary
        if: always()
        working-directory: frontend
        run: |
          {
            echo "## Visual regression"
            echo ""
            echo "HTML report artifact: \`playwright-report\` (30 days)."
            echo "On failure, download \`failed-screenshot-diffs\` (\`test-results/\`, **14-day** retention) for expected / actual / diff PNGs."
            echo ""
            if [ -d test-results ]; then
              echo "### Captured files"
              echo ""
              find test-results -type f \( -name '*diff*' -o -name '*actual*' -o -name '*expected*' -o -name '*.png' \) \
                | sort | sed 's/^/- `/' | sed 's/$/`/' || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
