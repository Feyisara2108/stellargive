name: Contract Checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2 # v2.7.3
        with:
          workspaces: contracts/stellar-give

      - name: Format check
        working-directory: contracts/stellar-give
        run: cargo fmt --check

      - name: Clippy
        working-directory: contracts/stellar-give
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: contracts/stellar-give
        run: cargo test --locked
