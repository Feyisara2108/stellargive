name: Nightly E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview environment URL to test (defaults to the E2E_PREVIEW_URL repository variable)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Nightly Playwright run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    env:
      # When empty, Playwright starts the local dev server instead.
      E2E_BASE_URL: ${{ inputs.preview_url || vars.E2E_PREVIEW_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --project=desktop --project=mobile --trace=retain-on-failure

      - name: Upload failure artifacts (traces, screenshots, report)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-e2e-failure-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: warn
