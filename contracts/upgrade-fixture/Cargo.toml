[package]
name = "upgrade-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"
publish = false

# Minimal contract used only as the upgrade target in
# contracts/stellar-give/tests/test_upgrade.rs. See that file and the
# `fixture` target in contracts/stellar-give/Makefile.

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
incremental = false
codegen-units = 1
lto = true
strip = "symbols"
