[package]
name = "stellar-give"
version = "0.1.0"
edition = "2021"
# Minimum Supported Rust Version. Bounded by locked dependencies (darling,
# serde_with require 1.88). Verified in CI by the `contract-msrv` job.
rust-version = "1.91.0"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.2"

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }
proptest = "1.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
incremental = false
codegen-units = 1
lto = true
strip = "symbols"
