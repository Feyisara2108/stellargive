services:
  stellar:
    # Pin a tag that supports Soroban protocol features used by soroban-sdk 27 (#1121)
    image: stellar/quickstart:soroban-dev
    command: --local --protocol-version 23
    ports:
      - "${STELLAR_PORT_RPC:-8000}:8000"
      - "${STELLAR_PORT_FRIENDBOT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Quickstart serves Soroban RPC at /soroban/rpc (not /rpc) (#1121)
      NEXT_PUBLIC_SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
      NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    depends_on:
      stellar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
