version: "3.9"

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-stellargive}/stellargive-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # NEXT_PUBLIC_* (RPC URL, network passphrase, contract ID, Sentry DSN) are
    # inlined into the client bundle when the image is built, so they cannot be
    # set here. They come from the repository variables docker-publish.yml
    # passes as build args — see docs/DEPLOYMENT.md (#1099).
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    user: "101:101"
